name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read # Required for checkout and zizmor online audits.

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP ${{ matrix.php-version }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4", "8.5"]
        dependencies: [highest, lowest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Install PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, dom, xml, xmlwriter
          tools: composer:v2
          coverage: pcov

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install highest dependencies
        if: matrix.dependencies == 'highest'
        run: composer update --prefer-dist --prefer-stable --no-interaction --no-progress

      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-dist --prefer-stable --prefer-lowest --no-interaction --no-progress

      - name: Check PHP platform requirements
        run: composer check-platform-reqs

      - name: Verify bundled templates
        run: composer templates:check

      - name: Run PHPUnit with coverage
        run: composer test -- --coverage-text --coverage-clover coverage.xml

      - name: Run PHPStan
        run: composer analyse

      - name: Check coding standard
        run: composer cs:check

      - name: Check Rector refactorings
        run: composer rector:check

  security:
    name: GitHub Actions security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
